name: smart_inventory_app
description: "A Flutter-based Smart Inventory & Stock Replenishment App with Supabase backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  supabase_flutter: ^2.5.6
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^5.1.0

  sqflite: any
  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
